# Package metadata for the twig scanner.
[package]
name = "twig"
version = "0.4.1"
edition = "2021"
license = 'MIT'

[dependencies]
serde = { version = "1", features = ["derive"] }
ratatui = "0.29"

[profile.release]
lto = true
codegen-units = 1

[[bin]]
name = "twig"
path = "src/main.rs"

[features]
default = ["tui"]
tui = []
debug-log = false

[limits]
max_line = 0x1000
depth = 0b1010
ratio = 1.5e3
