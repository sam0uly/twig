# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  BINARY: twig
  VERSION:
    sh: git describe --tags --always --dirty
  COMMIT:
    sh: git rev-parse HEAD
  LDFLAGS: >-
    -s -w
    -X samouly.fun/twig/internal/version.Version={{.VERSION}}
    -X samouly.fun/twig/internal/version.Commit={{.COMMIT}}

tasks:
  default:
    desc: build the release twig binary
    cmds:
      - go build -trimpath -ldflags '{{.LDFLAGS}}' -o {{.BINARY}} .

  build:debug:
    desc: build an unstripped binary with full debug info
    cmds:
      - go build -gcflags "all=-N -l" -o {{.BINARY}} .

  run:
    desc: run twig against the current repository
    interactive: true
    cmds:
      - go run . {{.CLI_ARGS}}

  run:staged:
    desc: run twig showing staged changes
    interactive: true
    cmds:
      - go run . --staged

  run:log:
    desc: run twig in commit browser mode
    interactive: true
    cmds:
      - go run . log

  install:
    desc: build twig and install it on the Go binary path
    cmds:
      - go install -trimpath -ldflags '{{.LDFLAGS}}' .

  debug:
    desc: run twig with debug logging to debug.log
    interactive: true
    cmds:
      - go run . 2> debug.log

  debug:basic:
    desc: run with reduced color depth for compatibility testing
    interactive: true
    cmds:
      - env TERM=xterm-color COLORTERM=xterm-color go run .

  test:
    desc: run tests with the race detector
    cmds:
      - go test -race -count 1 ./...

  test:update:
    desc: run tests and update snapshots
    cmds:
      - go test -count 1 ./...

  bench:
    desc: run benchmarks
    cmds:
      - go test -bench . -benchmem ./internal/diff/

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  fmt:
    desc: format code
    cmds:
      - gofumpt -w .
      - gofmt -w .

  lint:
    desc: golangci-lint
    cmds:
      - golangci-lint run

  tidy:
    desc: go mod tidy
    cmds:
      - go mod tidy

  build:all:
    desc: cross-compile every release target
    cmds:
      - goreleaser build --snapshot --clean

  release:
    desc: Create and push a new tag following semver
    vars:
      NEXT:
        sh: |-
          if [ -z "$(git tag --list 'v*')" ]; then
            echo v0.1.0
          else
            svu next --always || go run github.com/caarlos0/svu/v3@latest next --always
          fi
    prompt: "This will release {{.NEXT}}. Continue?"
    preconditions:
      - sh: '[ $(git symbolic-ref --short HEAD) = "main" ]'
        msg: Not on main branch
      - sh: "[ $(git status --porcelain=2 | wc -l) = 0 ]"
        msg: "Git is dirty"
      - sh: "git config --get user.signingkey >/dev/null"
        msg: "No tag signing key configured (git config user.signingkey)"
      - sh: 'gh run list --workflow ci.yml --commit $(git rev-parse HEAD) --status success --json conclusion -q ".[0].conclusion" | grep -q success'
        msg: "ci has not passed for this commit, or gh is not authenticated"
      - sh: 'gh run list --workflow snapshot.yml --commit $(git rev-parse HEAD) --status success --json conclusion -q ".[0].conclusion" | grep -q success'
        msg: "the goreleaser snapshot has not passed for this commit"
    cmds:
      - task: fetch-tags
      - git commit --allow-empty -m "{{.NEXT}}"
      - git tag --annotate --sign -m "{{.NEXT}}" {{.NEXT}} {{.CLI_ARGS}}
      - echo "Pushing {{.NEXT}}..."
      - git push origin main --follow-tags

  fetch-tags:
    desc: Refresh local tags from origin
    cmds:
      - git fetch --tags --force

  release:local:
    desc: Publish a release from this machine (needs goreleaser and GITHUB_TOKEN)
    cmds:
      - goreleaser release --clean

  release:check:
    desc: validate the goreleaser configuration
    cmds:
      - goreleaser check

  clean:
    desc: remove build artifacts
    cmds:
      - rm -rf dist {{.BINARY}} debug.log
