changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: features
      labels:
        - feat
        - enhancement
    - title: fixes
      labels:
        - fix
        - bug
    - title: performance
      labels:
        - perf
    - title: other changes
      labels:
        - "*"
