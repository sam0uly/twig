name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: module graph is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files are not gofmt clean:"
            echo "$out"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: race
        run: go test -race -count=1 ./...
      - name: coverage
        if: runner.os == 'Linux'
        run: |
          go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
          {
            echo '### coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: cross vet
        if: runner.os == 'Linux'
        run: |
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=freebsd GOARCH=amd64 go vet ./...
    env:
      CGO_ENABLED: 0
  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: release build and version smoke test
        run: |
          go build -trimpath \
            -ldflags "-s -w \
              -X samouly.fun/twig/internal/version.Version=0.0.0-ci \
              -X samouly.fun/twig/internal/version.Commit=${GITHUB_SHA}" \
            -o "$RUNNER_TEMP/twig" .
          "$RUNNER_TEMP/twig" --version | tee "$RUNNER_TEMP/version"
          grep -F "0.0.0-ci" "$RUNNER_TEMP/version"
      - name: size budget
        run: |
          size=$(stat -c%s "$RUNNER_TEMP/twig")
          echo "binary: $size bytes"
          if [ "$size" -gt 12582912 ]; then
            echo "binary grew past 12 MiB; revisit the dependency set"
            exit 1
          fi
      - name: module graph budget
        run: |
          count=$(go list -m all | wc -l)
          echo "modules: $count"
          if [ "$count" -gt 60 ]; then
            echo "the module graph grew past 60 modules"
            exit 1
          fi
      - name: every release target compiles
        run: |
          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64 \
            freebsd/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath \
              -ldflags "-s -w" -o /dev/null .
            echo "ok $target"
          done
    env:
      CGO_ENABLED: 0
